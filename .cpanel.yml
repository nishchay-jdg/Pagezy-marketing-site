---
deployment:
  tasks:
    - export DEPLOYPATH=/home/pagezy/public_html/
    # Backup server config (has real DB/API tokens — never overwrite)
    - /bin/cp $DEPLOYPATH/config.php /tmp/pagezy_config.bak 2>/dev/null; true
    # Deploy all files from repo
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
    # Restore real server config — tokens stay intact
    - /bin/cp /tmp/pagezy_config.bak $DEPLOYPATH/config.php 2>/dev/null; true
